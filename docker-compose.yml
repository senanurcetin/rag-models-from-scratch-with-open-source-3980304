# PostgreSQL with pgvector, ready for the scripts (matches the default DATABASE_URL in rag_config.py).
#   docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: text_embeddings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d text_embeddings"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
